[build]
  command = "vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route Angel's secure server-side API through the Netlify Function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Angel is a client-side SPA. Always serve index.html for application routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
